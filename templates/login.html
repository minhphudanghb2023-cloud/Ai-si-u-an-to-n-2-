<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>EduSafe AI - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#065f46 0%,#047857 50%,#10b981 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-box{background:white;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .logo{text-align:center;margin-bottom:24px}
    .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#059669,#10b981);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;color:white}
    .logo h1{font-size:22px;color:#065f46}.logo span{font-size:13px;color:#64748b;display:block;margin-top:4px}
    .tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:24px}
    .tab{flex:1;padding:10px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:#64748b;border:none;background:transparent}
    .tab.active{background:white;color:#059669;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
    .form-input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;font-family:inherit}
    .form-input:focus{border-color:#10b981}
    .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#059669,#10b981);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.3)}
    .error{background:#fef2f2;color:#dc2626;padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;display:none}
    .test-accounts{margin-top:20px;padding:16px;background:#f8fafc;border-radius:10px;font-size:12px}
    .test-accounts h4{font-size:12px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .test-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0}
    .test-row:last-child{border:none}
    .test-role{font-weight:600;color:#334155}.test-pass{color:#64748b;font-family:monospace}
    .quick-btn{padding:4px 10px;border:1px solid #e2e8f0;border-radius:6px;background:white;font-size:11px;cursor:pointer;color:#059669;font-weight:600}
    .quick-btn:hover{background:#ecfdf5}
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>EduSafe AI</h1>
            <span>Trợ lý AI phòng chống bạo lực học đường</span>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Đăng nhập</button>
            <button class="tab" onclick="switchTab('register')">Đăng ký</button>
        </div>
        <div class="error" id="errorMsg"></div>
        <div id="loginForm">
            <div class="form-group"><label>Tên đăng nhập</label><input type="text" class="form-input" id="username" placeholder="Nhập username" autofocus></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" class="form-input" id="password" placeholder="Nhập mật khẩu"></div>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">Đăng nhập</button>
        </div>
        <div id="registerForm" style="display:none">
            <div class="form-group"><label>Họ và tên</label><input type="text" class="form-input" id="regName" placeholder="Nguyễn Văn A"></div>
            <div class="form-group"><label>Tên đăng nhập</label><input type="text" class="form-input" id="regUsername" placeholder="username"></div>
            <div class="form-group"><label>Email</label><input type="email" class="form-input" id="regEmail" placeholder="email@example.com"></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" class="form-input" id="regPassword" placeholder="Tối thiểu 6 ký tự"></div>
            <div class="form-group"><label>Vai trò</label>
                <select class="form-input" id="regRole"><option value="student">Học sinh</option><option value="teacher">Giáo viên</option><option value="parent">Phụ huynh</option></select>
            </div>
            <div class="form-group"><label>Lớp (nếu là học sinh/giáo viên)</label><input type="text" class="form-input" id="regClass" placeholder="VD: 8A"></div>
            <button class="login-btn" onclick="doRegister()">Đăng ký</button>
        </div>
        <div class="test-accounts">
            <h4>Tài khoản test nhanh</h4>
            <div class="test-row"><span class="test-role">Học sinh</span><span class="test-pass">hs001 / 123456</span><button class="quick-btn" onclick="quickLogin('hs001','123456')">Đăng nhập</button></div>
            <div class="test-row"><span class="test-role">Giáo viên</span><span class="test-pass">gv001 / 123456</span><button class="quick-btn" onclick="quickLogin('gv001','123456')">Đăng nhập</button></div>
            <div class="test-row"><span class="test-role">Phụ huynh</span><span class="test-pass">ph001 / 123456</span><button class="quick-btn" onclick="quickLogin('ph001','123456')">Đăng nhập</button></div>
            <div class="test-row"><span class="test-role">Admin</span><span class="test-pass">admin / admin123</span><button class="quick-btn" onclick="quickLogin('admin','admin123')">Đăng nhập</button></div>
        </div>
    </div>
    <script>
    localStorage.clear();
    function switchTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(t==='login'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('loginForm').style.display='block';document.getElementById('registerForm').style.display='none'}else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block'}hideError()}
    function showError(m){const e=document.getElementById('errorMsg');e.textContent=m;e.style.display='block'}
    function hideError(){document.getElementById('errorMsg').style.display='none'}
    async function doLogin(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){showError('Vui lòng nhập đầy đủ thông tin');return}const b=document.getElementById('loginBtn');b.textContent='Đang đăng nhập...';b.disabled=true;hideError();try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok){showError(d.error||'Đăng nhập thất bại');b.textContent='Đăng nhập';b.disabled=false;return}localStorage.setItem('token',d.access_token);localStorage.setItem('user',JSON.stringify(d.user));const role=d.user.role;if(role==='admin')location.href='/admin';else if(role==='teacher')location.href='/teacher';else if(role==='parent')location.href='/parent';else location.href='/student'}catch(e){showError('Lỗi kết nối');b.textContent='Đăng nhập';b.disabled=false}}
    function quickLogin(u,p){document.getElementById('username').value=u;document.getElementById('password').value=p;doLogin()}
    async function doRegister(){const n=document.getElementById('regName').value.trim(),u=document.getElementById('regUsername').value.trim(),e=document.getElementById('regEmail').value.trim(),p=document.getElementById('regPassword').value,r=document.getElementById('regRole').value,c=document.getElementById('regClass').value.trim();if(!n||!u||!e||!p){showError('Vui lòng nhập đầy đủ thông tin');return}if(p.length<6){showError('Mật khẩu tối thiểu 6 ký tự');return}try{const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:n,username:u,email:e,password:p,role:r,class_name:c})});const d=await res.json();if(!res.ok){showError(d.error||'Đăng ký thất bại');return}alert('Đăng ký thành công! Hãy đăng nhập.');switchTab('login');document.getElementById('username').value=u}catch(e){showError('Lỗi kết nối')}}
    document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin()});
    </script>
</body>
</html>
